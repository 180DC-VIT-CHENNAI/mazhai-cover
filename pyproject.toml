[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mazhai-cover"
version = "0.1.0"
description = "Mazhai Cover — open-source parametric micro-insurance starter for gig riders in Chennai"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "Flask==2.2.5", "Werkzeug==2.2.3", "Jinja2==3.1.2", "requests==2.28.2", "python-dotenv==0.21.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
